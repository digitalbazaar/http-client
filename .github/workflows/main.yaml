name: Main CI

on: [push]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Run eslint
      run: npm run lint
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install with Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - run: npm install
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - name: Run ESM test with Node.js ${{ matrix.node-version }}
      run: npm run test-node
    - name: Run CJS test with Node.js ${{ matrix.node-version }}
      run: npm run test-node-cjs
  test-karma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Run karma tests
      run: npm run test-karma
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Generate coverage report
      run: npm run coverage-ci
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        # codecov/codecov-action#1955: the action's default CLI download path
        # verifies a GPG signature against a key fetched from
        # https://keybase.io/codecovsecurity/pgp_keys.asc, which has been
        # returning 404 since ~2026-06-06 -- an upstream Codecov outage, not
        # anything specific to this repo. `use_pypi` sources the CLI from
        # PyPI instead, skipping the broken key-import step entirely; this is
        # the maintainer-confirmed workaround (still needed as of this commit
        # even on the latest action version, v7.0.0). Safe to remove once
        # Codecov restores the Keybase key.
        use_pypi: true
